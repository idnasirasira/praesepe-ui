<header
    class="sticky top-0 z-40 w-full border-b border-border bg-surface/85 backdrop-blur-md"
    x-data="{ mobileOpen: false, close() { this.mobileOpen = false } }"
    x-on:keydown.escape.window="if (mobileOpen) close()"
    x-on:resize.window="if (window.innerWidth >= 768 && mobileOpen) close()"
>
    <div class="mx-auto flex h-14 max-w-7xl items-center justify-between gap-4 px-4 sm:px-6 lg:px-8">
        <div class="flex min-w-0 items-center gap-6">
            <a href="/" class="inline-flex items-center gap-2.5 text-base font-semibold tracking-tight text-fg">
                <span class="inline-flex size-7 items-center justify-center rounded-control bg-brand text-xs font-bold text-on-brand shadow-2xs" aria-hidden="true">P</span>
                <span class="truncate">Praesepe</span>
            </a>
            <nav aria-label="Main navigation" class="hidden md:flex md:items-center md:gap-1">
                <a href="#product" class="inline-flex h-10 items-center rounded-control px-3 text-sm font-medium text-fg-muted hover:bg-surface-sunken hover:text-fg">Product</a>
                <a href="#pricing" class="inline-flex h-10 items-center rounded-control px-3 text-sm font-medium text-fg-muted hover:bg-surface-sunken hover:text-fg">Pricing</a>
                <a href="#docs" class="inline-flex h-10 items-center rounded-control bg-surface-sunken px-3 text-sm font-medium text-fg" aria-current="page">Docs</a>
            </nav>
        </div>

        <div class="flex shrink-0 items-center gap-2">
            <div class="hidden items-center gap-2 md:flex">
                <a href="#" class="inline-flex h-8 items-center rounded-control px-2.5 text-xs font-medium text-fg-muted hover:bg-surface-sunken hover:text-fg">Sign in</a>
                <a href="#" class="inline-flex h-8 items-center rounded-control bg-brand px-2.5 text-xs font-medium text-on-brand shadow-2xs">Start free</a>
            </div>
            <button
                type="button"
                class="inline-flex size-9 items-center justify-center rounded-control border border-border bg-surface-raised text-fg shadow-2xs hover:bg-surface-sunken md:hidden"
                x-on:click="mobileOpen = !mobileOpen"
                x-bind:aria-expanded="mobileOpen.toString()"
                aria-controls="ui-navbar-marketing-floating"
                aria-label="Open navigation menu"
            >
                <svg x-show="!mobileOpen" class="size-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
                    <path stroke-linecap="round" d="M4 7h16M4 12h16M4 17h12" />
                </svg>
                <svg x-show="mobileOpen" x-cloak class="size-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
                    <path stroke-linecap="round" d="M18 6 6 18M6 6l12 12" />
                </svg>
            </button>
        </div>
    </div>

    <div
        x-show="mobileOpen"
        x-cloak
        id="ui-navbar-marketing-floating"
        role="dialog"
        aria-modal="true"
        aria-label="Mobile navigation"
        class="absolute inset-x-3 top-[calc(100%+0.5rem)] z-50 md:hidden"
        x-trap.inert.noscroll="mobileOpen"
    >
        <div
            class="overflow-hidden rounded-card border border-border bg-surface-raised shadow-xl ring-1 ring-black/5"
            x-show="mobileOpen"
            x-transition:enter="transition ease-out duration-200"
            x-transition:enter-start="opacity-0 scale-95 translate-y-1"
            x-transition:enter-end="opacity-100 scale-100 translate-y-0"
            x-transition:leave="transition ease-in duration-150"
            x-transition:leave-start="opacity-100 scale-100 translate-y-0"
            x-transition:leave-end="opacity-0 scale-95 translate-y-1"
            x-on:click.outside="close()"
        >
            <nav aria-label="Mobile navigation links" class="flex flex-col gap-1 px-3 py-3">
                <a href="#product" class="flex h-10 items-center rounded-control px-3 text-sm text-fg-muted hover:bg-surface-sunken hover:text-fg">Product</a>
                <a href="#pricing" class="flex h-10 items-center rounded-control px-3 text-sm text-fg-muted hover:bg-surface-sunken hover:text-fg">Pricing</a>
                <a href="#docs" class="flex h-10 items-center rounded-control bg-brand/10 px-3 text-sm font-medium text-brand" aria-current="page">Docs</a>
            </nav>
            <div class="flex flex-col gap-2 border-t border-border bg-surface p-3">
                <a href="#" class="inline-flex h-9 items-center justify-center rounded-control text-sm font-medium text-fg-muted hover:bg-surface-sunken hover:text-fg">Sign in</a>
                <a href="#" class="inline-flex h-9 items-center justify-center rounded-control bg-brand text-sm font-medium text-on-brand shadow-2xs">Start free</a>
            </div>
        </div>
    </div>
</header>
