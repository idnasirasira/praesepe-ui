<div class="w-full max-w-sm">
    <label for="email-basic" class="mb-1.5 block text-sm font-medium text-fg">Email</label>
    <div class="relative">
        <input
            id="email-basic"
            type="email"
            name="email"
            placeholder="you@company.com"
            required
            aria-describedby="email-basic-hint"
            class="h-10 w-full rounded-control border border-border bg-surface-raised px-3 text-sm text-fg shadow-sm placeholder:text-fg-subtle focus:border-border-strong"
        >
    </div>
    <p id="email-basic-hint" class="mt-1.5 text-xs text-fg-muted">We will never share your email.</p>
</div>
