<div class="w-full max-w-sm" x-data="{ show: false }">
    <label for="password-demo" class="mb-1.5 block text-sm font-medium text-fg">Password</label>
    <div class="relative">
        <input
            id="password-demo"
            name="password"
            x-bind:type="show ? 'text' : 'password'"
            placeholder="Enter password"
            class="h-10 w-full rounded-control border border-border bg-surface-raised px-3 pr-10 text-sm text-fg shadow-sm placeholder:text-fg-subtle focus:border-border-strong"
        >
        <button
            type="button"
            class="absolute inset-y-0 right-0 flex items-center px-3 text-fg-muted hover:text-fg"
            x-on:click="show = !show"
            x-bind:aria-label="show ? 'Hide password' : 'Show password'"
        >
            <span x-show="!show">Show</span>
            <span x-show="show" x-cloak>Hide</span>
        </button>
    </div>
</div>
