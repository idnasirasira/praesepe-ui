<div class="w-full max-w-lg">
    <label for="notes-error" class="mb-1.5 block text-sm font-medium text-fg">Notes</label>
    <textarea
        id="notes-error"
        name="notes"
        rows="3"
        aria-invalid="true"
        aria-describedby="notes-error-error"
        class="min-h-24 w-full resize-y rounded-control border border-danger bg-surface-raised px-3 py-2 text-sm text-fg shadow-sm"
    >Too short</textarea>
    <p id="notes-error-error" class="mt-1.5 text-xs text-danger">Please add at least 20 characters.</p>
</div>
