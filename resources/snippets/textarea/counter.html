<div class="w-full max-w-lg" x-data="{ count: 0, max: 120 }">
    <label for="invoice-memo-counter" class="mb-1.5 block text-sm font-medium text-fg">Customer-facing invoice memo</label>
    <textarea
        id="invoice-memo-counter"
        name="invoice_memo"
        rows="3"
        maxlength="120"
        aria-describedby="invoice-memo-counter-counter"
        class="min-h-24 w-full resize-y rounded-control border border-border bg-surface-raised px-3.5 py-2 text-sm text-fg shadow-2xs transition-colors duration-150 hover:border-border-strong focus:border-brand focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 focus-visible:ring-offset-surface"
        x-on:input="count = $event.target.value.length"
    ></textarea>
    <p id="invoice-memo-counter-counter" class="mt-1.5 text-right text-xs tabular-nums text-fg-subtle" aria-live="polite">
        <span x-text="count">0</span> / 120
    </p>
</div>
