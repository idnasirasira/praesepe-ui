<div class="w-full max-w-lg">
    <label for="bio-basic" class="mb-1.5 block text-sm font-medium text-fg">Bio</label>
    <textarea
        id="bio-basic"
        name="bio"
        rows="4"
        placeholder="Tell us about your product"
        aria-describedby="bio-basic-hint"
        class="min-h-24 w-full resize-y rounded-control border border-border bg-surface-raised px-3 py-2 text-sm text-fg shadow-sm placeholder:text-fg-subtle focus:border-border-strong"
    ></textarea>
    <p id="bio-basic-hint" class="mt-1.5 text-xs text-fg-muted">Keep it short and specific.</p>
</div>
