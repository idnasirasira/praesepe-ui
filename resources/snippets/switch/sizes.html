<div class="flex flex-col gap-4">
    <div class="flex items-center gap-3">
        <div class="relative inline-flex">
            <input type="checkbox" role="switch" class="peer absolute inset-0 z-10 h-5 w-9 cursor-pointer opacity-0" aria-label="Small switch">
            <span class="pointer-events-none inline-flex h-5 w-9 items-center rounded-pill bg-border-strong p-0.5 peer-checked:bg-brand peer-checked:[&_.thumb]:translate-x-4" aria-hidden="true">
                <span class="thumb block size-4 rounded-full bg-surface-raised shadow-sm transition-transform"></span>
            </span>
        </div>
        <span class="text-sm text-fg">Small</span>
    </div>
    <div class="flex items-center gap-3">
        <div class="relative inline-flex">
            <input type="checkbox" role="switch" checked class="peer absolute inset-0 z-10 h-6 w-11 cursor-pointer opacity-0" aria-label="Medium switch">
            <span class="pointer-events-none inline-flex h-6 w-11 items-center rounded-pill bg-border-strong p-0.5 peer-checked:bg-brand peer-checked:[&_.thumb]:translate-x-5" aria-hidden="true">
                <span class="thumb block size-5 rounded-full bg-surface-raised shadow-sm transition-transform"></span>
            </span>
        </div>
        <span class="text-sm text-fg">Medium</span>
    </div>
</div>
