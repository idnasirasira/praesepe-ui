<div class="flex flex-col gap-2">
    <div class="flex items-start gap-3">
        <div class="relative -ml-1.5 inline-flex size-10 shrink-0 items-center justify-center">
            <input type="checkbox" role="switch" class="peer absolute inset-0 z-10 size-full cursor-pointer opacity-0" aria-label="Compact low-stock alert">
            <span class="pointer-events-none inline-flex h-5 w-9 items-center rounded-pill bg-border-strong p-0.5 peer-checked:bg-brand peer-checked:[&_.thumb]:translate-x-4 peer-focus-visible:outline-none peer-focus-visible:ring-2 peer-focus-visible:ring-ring peer-focus-visible:ring-offset-2 peer-focus-visible:ring-offset-surface" aria-hidden="true">
                <span class="thumb block size-4 rounded-full bg-surface-raised shadow-sm transition-transform duration-150"></span>
            </span>
        </div>
        <span class="pt-2 text-sm text-fg">Compact (toolbar)</span>
    </div>
    <div class="flex items-start gap-3">
        <div class="relative -ml-1.5 inline-flex size-10 shrink-0 items-center justify-center">
            <input type="checkbox" role="switch" checked class="peer absolute inset-0 z-10 size-full cursor-pointer opacity-0" aria-label="Default tax remittance reminder">
            <span class="pointer-events-none inline-flex h-6 w-11 items-center rounded-pill bg-border-strong p-0.5 peer-checked:bg-brand peer-checked:[&_.thumb]:translate-x-5 peer-focus-visible:outline-none peer-focus-visible:ring-2 peer-focus-visible:ring-ring peer-focus-visible:ring-offset-2 peer-focus-visible:ring-offset-surface" aria-hidden="true">
                <span class="thumb block size-5 rounded-full bg-surface-raised shadow-sm transition-transform duration-150"></span>
            </span>
        </div>
        <span class="pt-2 text-sm text-fg">Default (settings)</span>
    </div>
</div>
