<div class="flex flex-wrap items-center justify-center gap-8 py-10">
    <span class="relative inline-flex" x-data="{ open: false }" x-on:mouseenter="open = true" x-on:mouseleave="open = false" x-on:focusin="open = true" x-on:focusout="open = false">
        <button type="button" class="rounded-control border border-border px-3 py-2 text-sm" aria-describedby="tip-top">Top</button>
        <span id="tip-top" role="tooltip" x-show="open" x-cloak class="absolute bottom-full left-1/2 mb-2 -translate-x-1/2 rounded-control bg-fg px-2 py-1 text-xs text-fg-inverse">Top</span>
    </span>
    <span class="relative inline-flex" x-data="{ open: false }" x-on:mouseenter="open = true" x-on:mouseleave="open = false" x-on:focusin="open = true" x-on:focusout="open = false">
        <button type="button" class="rounded-control border border-border px-3 py-2 text-sm" aria-describedby="tip-bottom">Bottom</button>
        <span id="tip-bottom" role="tooltip" x-show="open" x-cloak class="absolute top-full left-1/2 mt-2 -translate-x-1/2 rounded-control bg-fg px-2 py-1 text-xs text-fg-inverse">Bottom</span>
    </span>
    <span class="relative inline-flex" x-data="{ open: false }" x-on:mouseenter="open = true" x-on:mouseleave="open = false" x-on:focusin="open = true" x-on:focusout="open = false">
        <button type="button" class="rounded-control border border-border px-3 py-2 text-sm" aria-describedby="tip-left">Left</button>
        <span id="tip-left" role="tooltip" x-show="open" x-cloak class="absolute right-full top-1/2 mr-2 -translate-y-1/2 rounded-control bg-fg px-2 py-1 text-xs text-fg-inverse">Left</span>
    </span>
    <span class="relative inline-flex" x-data="{ open: false }" x-on:mouseenter="open = true" x-on:mouseleave="open = false" x-on:focusin="open = true" x-on:focusout="open = false">
        <button type="button" class="rounded-control border border-border px-3 py-2 text-sm" aria-describedby="tip-right">Right</button>
        <span id="tip-right" role="tooltip" x-show="open" x-cloak class="absolute left-full top-1/2 ml-2 -translate-y-1/2 rounded-control bg-fg px-2 py-1 text-xs text-fg-inverse">Right</span>
    </span>
</div>
