<span
    class="relative inline-flex"
    x-data="{ open: false }"
    x-on:mouseenter="open = true"
    x-on:mouseleave="open = false"
    x-on:focusin="open = true"
    x-on:focusout="open = false"
    x-on:keydown.escape.stop="open = false"
>
    <button type="button" class="rounded-control border border-border bg-surface-raised px-3 py-2 text-sm text-fg" aria-describedby="tip-basic">
        Hover or focus
    </button>
    <span
        id="tip-basic"
        role="tooltip"
        x-show="open"
        x-cloak
        class="pointer-events-none absolute bottom-full left-1/2 z-50 mb-2 -translate-x-1/2 rounded-control bg-fg px-2 py-1 text-xs text-fg-inverse"
    >
        Extra context for this action
    </span>
</span>
