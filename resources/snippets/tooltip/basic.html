<span
    class="relative inline-flex"
    x-data="{
        open: false,
        style: {},
        place() {
            const trigger = this.$refs.trigger;
            if (! trigger) return;
            const rect = trigger.getBoundingClientRect();
            this.style = {
                position: 'fixed',
                top: (rect.top - 8) + 'px',
                left: (rect.left + rect.width / 2) + 'px',
                transform: 'translate(-50%, -100%)',
            };
        },
        show() { this.open = true; this.$nextTick(() => this.place()); },
        hide() { this.open = false; },
    }"
    x-on:mouseenter="show()"
    x-on:mouseleave="hide()"
    x-on:focusin="show()"
    x-on:focusout="hide()"
    x-on:keydown.escape.stop="hide()"
>
    <button
        type="button"
        x-ref="trigger"
        class="inline-flex h-9 items-center rounded-control border border-border bg-surface-raised px-3.5 text-sm text-fg shadow-2xs"
        aria-describedby="tip-basic"
    >
        Stock status
    </button>
    <template x-teleport="body">
        <span
            id="tip-basic"
            role="tooltip"
            x-show="open"
            x-cloak
            x-bind:style="style"
            x-transition:enter="transition ease-out duration-150"
            x-transition:enter-start="opacity-0"
            x-transition:enter-end="opacity-100"
            x-transition:leave="transition ease-in duration-100"
            x-transition:leave-start="opacity-100"
            x-transition:leave-end="opacity-0"
            class="pointer-events-none z-[70] w-max max-w-xs rounded-control bg-fg px-2.5 py-1.5 text-xs leading-snug text-fg-inverse shadow-md ring-1 ring-black/5"
        >
            24 units left in Gudang A
        </span>
    </template>
</span>
