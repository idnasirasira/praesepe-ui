<div class="w-full max-w-md">
    <div class="flex items-start gap-3">
        <div class="relative mt-0.5 inline-flex size-4 shrink-0">
            <input
                id="select-all"
                type="checkbox"
                name="select_all"
                class="peer absolute inset-0 z-10 size-4 cursor-pointer opacity-0"
                x-data
                x-init="$el.indeterminate = true"
            >
            <span class="pointer-events-none flex size-4 items-center justify-center rounded-[0.3rem] border border-border-strong bg-surface-raised text-on-brand shadow-sm peer-indeterminate:border-brand peer-indeterminate:bg-brand peer-indeterminate:[&_svg]:opacity-100" aria-hidden="true">
                <svg class="size-3 opacity-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25"><path stroke-linecap="round" d="M6 12h12" /></svg>
            </span>
        </div>
        <div>
            <label for="select-all" class="block text-sm font-medium text-fg">Select all rows</label>
            <p class="mt-0.5 text-sm text-fg-muted">Some rows in this page are selected.</p>
        </div>
    </div>
</div>
