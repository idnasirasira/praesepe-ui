<fieldset class="max-w-sm space-y-1">
    <legend class="mb-2 text-sm font-medium text-fg">Invoice tax mode</legend>
    <div class="inline-flex items-start gap-3">
        <div class="relative -ml-1.5 inline-flex size-10 shrink-0 items-center justify-center">
            <input id="tax-inclusive" type="radio" name="tax_mode" value="inclusive" checked class="peer absolute inset-0 z-10 size-full cursor-pointer opacity-0">
            <span class="pointer-events-none flex size-4 items-center justify-center rounded-full border border-border-strong bg-surface-raised shadow-2xs peer-checked:border-brand peer-checked:[&_.dot]:opacity-100 peer-focus-visible:outline-none peer-focus-visible:ring-2 peer-focus-visible:ring-ring peer-focus-visible:ring-offset-2 peer-focus-visible:ring-offset-surface" aria-hidden="true">
                <span class="dot size-2 rounded-full bg-brand opacity-0"></span>
            </span>
        </div>
        <label for="tax-inclusive" class="pt-2 text-sm font-medium text-fg">PPN inclusive</label>
    </div>
    <div class="inline-flex items-start gap-3">
        <div class="relative -ml-1.5 inline-flex size-10 shrink-0 items-center justify-center">
            <input id="tax-exclusive" type="radio" name="tax_mode" value="exclusive" class="peer absolute inset-0 z-10 size-full cursor-pointer opacity-0">
            <span class="pointer-events-none flex size-4 items-center justify-center rounded-full border border-border-strong bg-surface-raised shadow-2xs peer-checked:border-brand peer-checked:[&_.dot]:opacity-100 peer-focus-visible:outline-none peer-focus-visible:ring-2 peer-focus-visible:ring-ring peer-focus-visible:ring-offset-2 peer-focus-visible:ring-offset-surface" aria-hidden="true">
                <span class="dot size-2 rounded-full bg-brand opacity-0"></span>
            </span>
        </div>
        <label for="tax-exclusive" class="pt-2 text-sm font-medium text-fg">PPN exclusive</label>
    </div>
</fieldset>
