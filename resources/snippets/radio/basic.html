<fieldset class="max-w-sm space-y-3">
    <legend class="text-sm font-medium text-fg">Billing cycle</legend>
    <div class="inline-flex items-start gap-3">
        <div class="relative mt-0.5 inline-flex size-4 shrink-0">
            <input id="cycle-monthly" type="radio" name="cycle" value="monthly" checked class="peer absolute inset-0 z-10 size-4 cursor-pointer opacity-0">
            <span class="pointer-events-none flex size-4 items-center justify-center rounded-full border border-border-strong bg-surface-raised shadow-sm peer-checked:border-brand peer-checked:[&_.dot]:opacity-100" aria-hidden="true">
                <span class="dot size-2 rounded-full bg-brand opacity-0"></span>
            </span>
        </div>
        <label for="cycle-monthly" class="text-sm font-medium text-fg">Monthly</label>
    </div>
    <div class="inline-flex items-start gap-3">
        <div class="relative mt-0.5 inline-flex size-4 shrink-0">
            <input id="cycle-yearly" type="radio" name="cycle" value="yearly" class="peer absolute inset-0 z-10 size-4 cursor-pointer opacity-0">
            <span class="pointer-events-none flex size-4 items-center justify-center rounded-full border border-border-strong bg-surface-raised shadow-sm peer-checked:border-brand peer-checked:[&_.dot]:opacity-100" aria-hidden="true">
                <span class="dot size-2 rounded-full bg-brand opacity-0"></span>
            </span>
        </div>
        <label for="cycle-yearly" class="text-sm font-medium text-fg">Yearly</label>
    </div>
</fieldset>
