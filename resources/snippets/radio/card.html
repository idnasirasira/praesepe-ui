<fieldset class="grid max-w-xl gap-3 sm:grid-cols-2">
    <legend class="mb-1 text-sm font-medium text-fg">Fulfillment warehouse</legend>
    <label class="flex cursor-pointer items-start gap-3 rounded-card border border-border bg-surface-raised p-4 shadow-2xs transition-colors duration-150 hover:border-border-strong has-[:checked]:border-brand has-[:checked]:bg-brand/5 focus-within:outline-none focus-within:ring-2 focus-within:ring-ring focus-within:ring-offset-2 focus-within:ring-offset-surface">
        <span class="relative -ml-1.5 inline-flex size-10 shrink-0 items-center justify-center">
            <input id="warehouse-jkt" type="radio" name="warehouse" value="jkt" checked class="peer absolute inset-0 z-10 size-full cursor-pointer opacity-0">
            <span class="pointer-events-none flex size-4 items-center justify-center rounded-full border border-border-strong bg-surface-raised shadow-2xs peer-checked:border-brand peer-checked:[&_.dot]:opacity-100" aria-hidden="true">
                <span class="dot size-2 rounded-full bg-brand opacity-0"></span>
            </span>
        </span>
        <span class="min-w-0 flex-1 pt-2">
            <span class="block text-sm font-medium text-fg">Jakarta Pusat</span>
            <span class="mt-0.5 block text-sm text-fg-muted leading-relaxed">Same-day for Jabodetabek orders.</span>
        </span>
    </label>
    <label class="flex cursor-pointer items-start gap-3 rounded-card border border-border bg-surface-raised p-4 shadow-2xs transition-colors duration-150 hover:border-border-strong has-[:checked]:border-brand has-[:checked]:bg-brand/5 focus-within:outline-none focus-within:ring-2 focus-within:ring-ring focus-within:ring-offset-2 focus-within:ring-offset-surface">
        <span class="relative -ml-1.5 inline-flex size-10 shrink-0 items-center justify-center">
            <input id="warehouse-sby" type="radio" name="warehouse" value="sby" class="peer absolute inset-0 z-10 size-full cursor-pointer opacity-0">
            <span class="pointer-events-none flex size-4 items-center justify-center rounded-full border border-border-strong bg-surface-raised shadow-2xs peer-checked:border-brand peer-checked:[&_.dot]:opacity-100" aria-hidden="true">
                <span class="dot size-2 rounded-full bg-brand opacity-0"></span>
            </span>
        </span>
        <span class="min-w-0 flex-1 pt-2">
            <span class="block text-sm font-medium text-fg">Surabaya Timur</span>
            <span class="mt-0.5 block text-sm text-fg-muted leading-relaxed">East Java hub with cold-chain bay.</span>
        </span>
    </label>
</fieldset>
