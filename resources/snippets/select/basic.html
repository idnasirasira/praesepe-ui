<div class="w-full max-w-sm">
    <label for="plan-basic" class="mb-1.5 block text-sm font-medium text-fg">Plan</label>
    <div class="relative">
        <select
            id="plan-basic"
            name="plan"
            required
            aria-describedby="plan-basic-hint"
            class="h-10 w-full appearance-none rounded-control border border-border bg-surface-raised pl-3 pr-9 text-sm text-fg shadow-sm focus:border-border-strong"
        >
            <option value="" disabled selected>Select a plan</option>
            <option value="starter">Starter</option>
            <option value="growth">Growth</option>
            <option value="scale">Scale</option>
        </select>
        <span class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-2.5 text-fg-subtle" aria-hidden="true">
            <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6" />
            </svg>
        </span>
    </div>
    <p id="plan-basic-hint" class="mt-1.5 text-xs text-fg-muted">You can change this later.</p>
</div>
