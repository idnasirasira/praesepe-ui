<div
    class="flex gap-3 rounded-card border border-warning/30 bg-warning-soft p-4 shadow-2xs"
    role="status"
    x-data="{ show: true }"
    x-show="show"
    x-cloak
    x-transition:leave="transition ease-in duration-100"
    x-transition:leave-start="opacity-100"
    x-transition:leave-end="opacity-0"
>
    <span class="mt-0.5 shrink-0 text-warning" aria-hidden="true">!</span>
    <div class="min-w-0 flex-1">
        <p class="text-sm font-semibold tracking-tight text-fg">Warehouse capacity</p>
        <p class="mt-1 text-sm text-fg-muted leading-relaxed">Jakarta Pusat is at 92% bin utilization. Consider diverting ORD-2026-4500+ to Surabaya.</p>
    </div>
    <button
        type="button"
        class="inline-flex size-10 shrink-0 items-center justify-center rounded-control text-fg-muted transition-colors duration-150 hover:bg-surface/50 hover:text-fg focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 focus-visible:ring-offset-surface"
        x-on:click="show = false"
        aria-label="Dismiss alert"
    >
        <svg class="size-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M6 6l12 12M18 6 6 18" /></svg>
    </button>
</div>
